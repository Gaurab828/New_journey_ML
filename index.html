<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML_Journey</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/2.3.4/p5.min.js"></script>
    <script src="libraries/grafica.min.js"></script>
  </head>
<body>
    Creating a walker class that marks random direction out of 9 options.
    <script>
let walker;
function setup(){
    createCanvas(640,250);
    walker=new walk();
    background(255);
}
function draw(){
    walker.follow();
    walker.show();
}
class walk{
    constructor(){
        this.x=width/2;
        this.y=height/2;
}
show(){
    stroke(0);
    point(this.x,this.y);
}
step(){
    let choicex= floor(random(3))-1;
    let choicey= floor(random(3))-1;
    this.x+=choicex;
    this.y+=choicey;
}
follow(){
    let a=mouseX-this.x;
    let b=mouseY-this.y;
    let ran=floor(random(2));
    let c,d;
    if (ran===1){
    if (a>0){
        c=1;
    }else if (a<0){
        c=-1;
    }else{c=0;}
    if (b>0){
        d=1;
    }else if (b<0){
        d=-1;
    }else{d=0;}
    this.x+=c;
    this.y+=d;
}
else{
    this.step();}}
}
</script>
<br>Here is a walker which follows mouse 50 percent of the times.
<script>
    setup()
    walker.show()
    walker.follow()
  
</script>
</body>
</html>
