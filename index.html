<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML_Journey</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/2.3.4/p5.min.js"></script>
    <script src="libraries/grafica.min.js"></script>
  </head>
<body>
    Creating a walker class that marks random direction out of 9 options.
    <script>
let spreadSlider;
let sizeSlider;
let sizespSlider;
let baseHueSlider;
let huespSlider;
let alphaSlider;
//let walker;
function setup(){
    createCanvas(640,250);
    //walker=new walk();
    //background(255);
    colorMode(HSB);
    background(97);
    createControls(300);
}
function draw(){
//    walker.step();//for random walk
//    walker.show();
//    walker.follow();//for mouse follow
//    walker.show();
//let x = randomGaussian(320,80);//320 is average and 60 is deviation.//for gaussian random circles
//noStroke();
//fill(0,10);
//circle(x,120,18);
translate(width/2,height/2);
scale(height/2);
x = randomGaussian(0, spreadSlider.value());
y = randomGaussian(0,spreadSlider.value());
size = randomGaussian(sizeSlider.value()/height,sizespSlider.value());
if (size <=0){
    size =0.01;
}
let paintHue = randomGaussian(baseHueSlider.value(),huespSlider.value());
let paintSat = randomGaussian(80,20);
let paintBright = randomGaussian(80,20);
if (paintHue <0){
    paintHue += 360;
} else if (paintHue >= 360){
    paintHue -=360;
}
if (paintSat > 100){
    paintSat = 100;
}
if (paintBright > 100){
    paintBright =100;
}
noStroke();
fill(paintHue,paintSat,paintBright,alphaSlider.value());
ellipse(x,y,size,size);
}
function createControls(ypos){
    let xpos = 0;
    Title=createP("Paint Splatter Simulation");
    Title.position(xpos, ypos - 50);
    Title.style("font-size","14pt");
    Title.style("font-weight","bold");
    xpos += 220;

    clearButton = createButton("clear");
    clearButton.position(xpos,ypos - 30);
    clearButton.mousePressed(clearButtonClicked);

    xpos = 0;
    spreadTitle = createP("Spread");
    spreadTitle.position(xpos,ypos);
    xpos += 50;

    spreadSlider = createSlider(0, 0.75, 0.25, 0);
    spreadSlider.position(xpos, ypos+ 15);
    spreadSlider.size(80);
    xpos += 100;

    sizeTitle = createP("size");
    sizeTitle.position(xpos, ypos);
    xpos += 35;

    sizeSlider = createSlider(5, 50, 20, 0);
    sizeSlider.position(xpos, ypos + 15);
    sizeSlider.size(80);
    xpos += 100;

    sizespTitle = createP("Size Spread");
    sizespTitle.position(xpos, ypos);
    xpos += 80;

    sizespSlider = createSlider(0,0.1,0.01,0);
    sizespSlider.position(xpos, ypos + 15);
    sizespSlider.size(80);
    xpos += 100;

    xpos = 0;
    baseHueTitle = createP("Base Hue");
    baseHueTitle.position(xpos, ypos + 15);
    xpos += 70;

    baseHueSlider = createSlider(0, 360, 250, 0);
    baseHueSlider.position(xpos,ypos + 30);
    baseHueSlider.size(80);
    xpos += 100;

    huespTitle = createP("Hue Spread");
    huespTitle.position(xpos,ypos + 15);
    xpos+=80;

    huespSlider = createSlider(0,100,15,0);
    huespSlider.position(xpos, ypos + 30);
    huespSlider.size(80);
    xpos += 100;

    alphaTitle = createP("Transparency");
    alphaTitle.position(xpos,ypos + 15);
    xpos += 90;

    alphaSlider = createSlider(0, 1, 0.75, 0);
    alphaSlider.position(xpos,ypos + 30);
    alphaSlider.size(80);
    xpos += 100;
}

function clearButtonClicked(){
    background(97);
}
class walk{
    constructor(){
        this.x=width/2;
        this.y=height/2;
}
show(){
    stroke(0);
    point(this.x,this.y);
}
step(){
    let choicex= floor(random(3))-1;
    let choicey= floor(random(3))-1;
    this.x+=choicex;
    this.y+=choicey;
}
follow(){
    let a=mouseX-this.x;
    let b=mouseY-this.y;
    let ran=floor(random(100));
   let c,d;
    if (ran<44){
    if (a>0){
        c=1;
    }else if (a<0){
        c=-1;
    }else{c=0;}
    if (b>0){
        d=1;
    }else if (b<0){
        d=-1;
    }else{d=0;}
    this.x+=c;
    this.y+=d;
}
else{
    this.step();}}
}
</script>
<br>Here is a walker which follows mouse 50 percent of the times.
<br>using gaussian random to create circle pattern to see where most occupy.
<br>creating a polka dots generator using gaussian slider.
</body>
</html>
